<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kişisel Not Yönetimi</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; margin-bottom: 1.5rem; }
    a.button, button { background: #2563eb; color: #fff; border: 0; border-radius: 6px; padding: .5rem .9rem; text-decoration: none; cursor: pointer; font-size: 1rem; }
    .note { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .note h2 { margin: 0 0 .5rem; font-size: 1.15rem; }
    .note p { white-space: pre-wrap; margin: 0 0 .75rem; }
    .meta { color: #666; font-size: .85rem; }
    input[type=text], textarea { width: 100%; padding: .5rem; font-size: 1rem; box-sizing: border-box; margin-bottom: 1rem; }
    .error { color: #b91c1c; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1><a href="{{ url_for('index') }}" style="text-decoration:none;color:inherit">Kişisel Not Yönetimi</a></h1>
    <a class="button" href="{{ url_for('new_note') }}">+ Yeni Not</a>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
